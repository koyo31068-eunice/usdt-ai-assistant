<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT AI 비서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단: 서비스 이름 + 서버 상태 -->
  <header class="topbar">
    <h1 class="brand">USDT AI 비서</h1>
    <p class="brand-sub">빗썸 USDT/KRW 1시간봉 데이터를 근거로 답하는 AI</p>
    <span id="server-status" class="status status-wait" role="status">서버 확인 중</span>
  </header>

  <!-- Render 무료 서버 콜드스타트 안내 -->
  <div id="wake-banner" class="wake-banner" hidden>
    무료 서버가 쉬고 있어서 깨우는 중입니다. 첫 접속은 최대 1분 정도 걸릴 수 있어요.
    <span id="wake-count"></span>
  </div>

  <!-- 데이터 요약 보드 -->
  <section class="board" aria-label="데이터 요약">
    <div class="board-price">
      <p class="board-label">마지막 종가 <span id="sum-latest-at"></span></p>
      <p class="board-value"><span id="sum-latest">-</span><small>원</small></p>
      <p id="sum-change" class="board-change">-</p>
    </div>
    <div class="board-chart">
      <svg id="sparkline" viewBox="0 0 600 120" preserveAspectRatio="none" role="img"
           aria-label="기간 전체 가격 흐름"></svg>
      <p id="sum-trend" class="board-trend">추세 계산 중</p>
      <button id="btn-refresh-summary" class="btn-ghost board-refresh" type="button">요약 새로고침</button>
    </div>
    <dl class="board-stats">
      <div><dt>기간</dt><dd id="sum-period">-</dd></div>
      <div><dt>데이터 수</dt><dd id="sum-count">-</dd></div>
      <div><dt>평균</dt><dd id="sum-avg">-</dd></div>
      <div><dt>최고</dt><dd id="sum-max">-</dd></div>
      <div><dt>최저</dt><dd id="sum-min">-</dd></div>
      <div><dt>평균 괴리율</dt><dd id="sum-premium">-</dd></div>
    </dl>
  </section>

  <main class="layout">
    <!-- 왼쪽: 대화 기록 -->
    <aside class="panel history" aria-label="대화 기록">
      <div class="panel-head">
        <h2>대화 기록</h2>
        <button id="btn-new-chat" class="btn-small" type="button">새 대화</button>
      </div>
      <ul id="conv-list" class="conv-list"></ul>
    </aside>

    <!-- 가운데: 채팅 -->
    <section class="panel chat" aria-label="AI 채팅">
      <div class="panel-head">
        <h2 id="chat-title">새 대화</h2>
      </div>
      <div id="messages" class="messages" aria-live="polite">
        <div id="chat-empty" class="chat-empty">
          <p>저장된 USDT 데이터를 바탕으로 무엇이든 물어보세요.</p>
          <div class="chips">
            <button type="button" class="chip">최근 USDT 흐름 어때?</button>
            <button type="button" class="chip">가장 비쌌던 때는 언제야?</button>
            <button type="button" class="chip">11월 6일에는 무슨 일이 있었어?</button>
            <button type="button" class="chip">지금 신호는 Long이야 Short이야?</button>
          </div>
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="sr-only">질문 입력</label>
        <textarea id="chat-input" rows="2" maxlength="1000"
                  placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button id="btn-send" class="btn-primary" type="submit">보내기</button>
      </form>
    </section>

    <!-- 오른쪽: 데이터 관리 -->
    <section class="panel data" aria-label="데이터 관리">
      <div class="panel-head">
        <h2>데이터 관리</h2>
        <span id="data-count" class="muted"></span>
      </div>
      <form id="data-form" class="data-form">
        <label>시각
          <input id="f-date" type="datetime-local" step="3600" required>
        </label>
        <label>가격(원)
          <input id="f-value" type="number" step="0.01" min="0.01" placeholder="1356" required>
        </label>
        <label class="span-2">메모
          <input id="f-memo" type="text" maxlength="200" placeholder="예: 괴리 +0.96% · Neutral">
        </label>
        <div class="form-actions span-2">
          <button id="btn-save" class="btn-primary" type="submit">데이터 추가</button>
          <button id="btn-cancel" class="btn-ghost" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <ol id="data-list" class="data-list"></ol>
      <button id="btn-more" class="btn-ghost more" type="button" hidden>더 보기</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- config.js: API 서버 주소 (로컬은 직접 작성, Vercel은 배포 시 환경 변수로 자동 생성) -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
